<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Y-tion Cockpit</title>
<style>
  :root{
    --ground:#FBF7FB; --panel:#FFFFFF; --panel-2:#F5EEF8; --hair:#ECE3F0;
    --ink:#4B4658; --ink-soft:#8A8398; --ink-faint:#B7AFC4;
    --lav:#9F8AE0; --lav-soft:#C7B6F2; --peach:#F0A98C; --peach-soft:#F8C9B4;
    --mint:#6FC7A8; --mint-soft:#AEE3CF; --sky:#7EB6E8; --sky-soft:#BEDCF5;
    --butter:#E2C169;
    --frame:#E7DDEE; --frame-2:#D9CCE4; --crease:rgba(120,90,160,.12);
    --good:#6FC7A8; --warn:#E0A94E; --crit:#EC8892;
    --shadow:0 24px 55px -24px rgba(120,90,170,.45);
    --r:22px;
    --sans:'Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP','Yu Gothic',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#1A161F; --panel:#241E2B; --panel-2:#2E2738; --hair:#392F44;
      --ink:#ECE3F4; --ink-soft:#B1A6C0; --ink-faint:#79708A;
      --lav:#B9A7F0; --lav-soft:#8F7BD0; --peach:#F3B79E; --peach-soft:#C98C74;
      --mint:#8FDCC0; --mint-soft:#5AA98C; --sky:#9CC8F2; --sky-soft:#5F8CC0;
      --butter:#EBCB7C;
      --frame:#0E0B12; --frame-2:#1C1622; --crease:rgba(255,255,255,.06);
      --good:#8FDCC0; --warn:#EBCB7C; --crit:#F09AA2;
      --shadow:0 28px 65px -22px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    --ground:#1A161F; --panel:#241E2B; --panel-2:#2E2738; --hair:#392F44;
    --ink:#ECE3F4; --ink-soft:#B1A6C0; --ink-faint:#79708A;
    --lav:#B9A7F0; --lav-soft:#8F7BD0; --peach:#F3B79E; --peach-soft:#C98C74;
    --mint:#8FDCC0; --mint-soft:#5AA98C; --sky:#9CC8F2; --sky-soft:#5F8CC0;
    --butter:#EBCB7C;
    --frame:#0E0B12; --frame-2:#1C1622; --crease:rgba(255,255,255,.06);
    --good:#8FDCC0; --warn:#EBCB7C; --crit:#F09AA2;
    --shadow:0 28px 65px -22px rgba(0,0,0,.7);
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(90% 60% at 15% -5%, color-mix(in srgb,var(--lav) 14%,transparent), transparent 60%),
      radial-gradient(80% 55% at 100% 0%, color-mix(in srgb,var(--peach) 12%,transparent), transparent 55%),
      var(--ground);
    color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased;
    line-height:1.55; min-height:100vh; padding:26px 16px 60px;
    display:flex; flex-direction:column; align-items:center; gap:22px;
  }
  .tabnum{font-variant-numeric:tabular-nums}

  .topbar{width:100%; max-width:900px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap}
  .brand{display:flex; align-items:baseline; gap:10px}
  .brand .mark{font-weight:800; font-size:24px; letter-spacing:-.02em;
    background:linear-gradient(120deg,var(--lav),var(--peach)); -webkit-background-clip:text; background-clip:text; color:transparent}
  .brand .sub{font-size:12px; color:var(--ink-faint); letter-spacing:.16em; text-transform:uppercase}
  .controls{display:flex; align-items:center; gap:10px}
  .seg{display:inline-flex; background:var(--panel-2); border:1px solid var(--hair); border-radius:999px; padding:3px}
  .seg button{appearance:none; border:0; background:transparent; cursor:pointer; font-family:inherit; font-size:13px; font-weight:700;
    color:var(--ink-soft); padding:7px 16px; border-radius:999px; transition:.2s}
  .seg button[aria-pressed="true"]{background:var(--panel); color:var(--lav); box-shadow:0 2px 6px rgba(120,90,170,.22)}
  .seg button:focus-visible{outline:2px solid var(--lav); outline-offset:2px}
  .ghost{appearance:none; cursor:pointer; font-family:inherit; font-size:13px; font-weight:700; color:var(--ink-soft);
    background:var(--panel-2); border:1px solid var(--hair); padding:8px 14px; border-radius:999px; transition:.2s}
  .ghost:hover{color:var(--lav)}
  .ghost:focus-visible{outline:2px solid var(--lav); outline-offset:2px}

  .stage{width:100%; display:flex; justify-content:center; perspective:1600px}
  .device{--w:372px; width:var(--w); flex:0 0 var(--w); background:var(--frame); border-radius:40px; padding:13px;
    box-shadow:var(--shadow), inset 0 0 0 1px rgba(255,255,255,.4);
    transition:width .6s cubic-bezier(.65,.02,.2,1), flex-basis .6s cubic-bezier(.65,.02,.2,1); position:relative}
  .device.open{--w:892px}   /* Fold8 内側はほぼ正方形 */
  .device::before{content:""; position:absolute; right:-3px; top:130px; width:3px; height:60px; background:var(--frame-2); border-radius:2px}
  .screen{position:relative; background:var(--ground); border-radius:29px; overflow:hidden; min-height:748px; display:flex; flex-direction:column}
  .device.open .screen{min-height:792px}
  .device.open .screen::after{content:""; position:absolute; top:0; bottom:0; left:50%; width:28px; transform:translateX(-50%);
    background:linear-gradient(90deg,transparent,var(--crease) 42%,var(--crease) 58%,transparent); pointer-events:none; z-index:5}
  .statusbar{display:flex; align-items:center; justify-content:space-between; padding:12px 22px 4px; font-size:12px; color:var(--ink-soft); font-weight:700}
  .statusbar .dots{display:flex; gap:5px; align-items:center}
  .statusbar .dots span{width:6px;height:6px;border-radius:50%;background:var(--ink-faint);opacity:.55}
  .statusbar .dots i{width:16px;height:9px;border:1.5px solid var(--ink-faint);border-radius:2px;display:inline-block;position:relative}
  .statusbar .dots i::after{content:"";position:absolute;inset:1.5px;width:64%;background:var(--mint);border-radius:1px}

  .canvas{padding:6px 14px 16px; overflow-y:auto; flex:1}
  .device.open .canvas{padding-left:8px; padding-right:8px}
  .grid{display:grid; grid-template-columns:1fr; gap:13px}
  .device.open .grid{grid-template-columns:1fr 1fr; gap:18px; align-items:start; padding:0}
  .col{display:grid; gap:13px; min-width:0}

  .card{background:var(--panel); border:1px solid var(--hair); border-radius:var(--r); padding:16px; min-width:0;
    box-shadow:0 6px 20px -14px rgba(120,90,170,.35)}
  .card h3{margin:0 0 12px; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint);
    font-weight:800; display:flex; align-items:center; gap:8px}
  .card h3 .tick{width:16px;height:16px;border-radius:6px;display:grid;place-items:center;font-size:10px}

  /* greeting hero */
  .hero{background:
      radial-gradient(120% 130% at 0% 0%, color-mix(in srgb,var(--lav) 26%,transparent), transparent 55%),
      radial-gradient(120% 130% at 100% 20%, color-mix(in srgb,var(--peach) 24%,transparent), transparent 55%),
      var(--panel); position:relative; overflow:hidden}
  .hero .hi{font-size:13px;color:var(--ink-soft);font-weight:700}
  .hero .big{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:2px 0 12px}
  .hero .sums{display:flex;gap:9px;flex-wrap:wrap}
  .sumpill{display:flex;align-items:center;gap:7px;background:color-mix(in srgb,var(--panel-2) 70%,transparent);
    border:1px solid var(--hair);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700}
  .sumpill b{font-size:15px} .sumpill .d{width:8px;height:8px;border-radius:50%}

  /* focus */
  .focus{display:grid;gap:9px}
  .frow{display:flex;align-items:center;gap:11px;background:var(--panel-2);border-radius:14px;padding:11px 13px}
  .frow .tagd{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
  .frow .ft{flex:1;min-width:0;font-size:14px;font-weight:700}
  .frow .fmeta{font-size:11px;color:var(--ink-faint);font-weight:700;white-space:nowrap}
  .src{font-size:9px;font-weight:800;padding:2px 7px;border-radius:999px;letter-spacing:.03em}
  .src-w{background:color-mix(in srgb,var(--sky) 24%,transparent);color:var(--sky)}
  .src-p{background:color-mix(in srgb,var(--peach) 26%,transparent);color:var(--peach)}
  .src-m{background:color-mix(in srgb,var(--lav) 26%,transparent);color:var(--lav)}

  /* tasks */
  .task{display:flex;align-items:center;gap:11px;padding:9px 0;border-top:1px solid var(--hair)}
  .task:first-of-type{border-top:0}
  .rank{flex:0 0 24px;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff}
  .rk-S{background:linear-gradient(135deg,var(--crit),#e07882)}
  .rk-A{background:linear-gradient(135deg,var(--peach),#e6926f)}
  .rk-B{background:linear-gradient(135deg,var(--lav),#8f78d6)}
  .rk-C{background:var(--ink-faint)}
  .task .tt{flex:1;min-width:0;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .task .badge{font-size:9px;font-weight:800;padding:2px 6px;border-radius:6px;background:color-mix(in srgb,var(--sky) 22%,transparent);color:var(--sky);white-space:nowrap}
  .task .due{font-size:11px;color:var(--ink-faint);font-weight:700;white-space:nowrap}
  .task .due.soon{color:var(--crit)}
  .task .box{width:17px;height:17px;border-radius:6px;border:2px solid var(--hair);flex:0 0 17px}
  .task.done .tt{color:var(--ink-faint);text-decoration:line-through}
  .task.done .box{background:var(--mint);border-color:var(--mint);position:relative}
  .task.done .box::after{content:"✓";position:absolute;inset:0;color:#fff;font-size:10px;display:grid;place-items:center}

  /* schedule timeline */
  .tl{display:grid;gap:0}
  .ev{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:9px 0;position:relative}
  .ev .tm{font-size:12px;font-weight:800;color:var(--ink-soft);text-align:right;padding-top:2px}
  .ev .bd{border-left:3px solid var(--sky);padding:8px 12px;border-radius:0 12px 12px 0;background:color-mix(in srgb,var(--sky) 12%,transparent)}
  .ev.now .bd{border-left-color:var(--crit);background:color-mix(in srgb,var(--crit) 12%,transparent)}
  .ev .en{font-size:13.5px;font-weight:700}
  .ev .em{font-size:11px;color:var(--ink-faint);font-weight:600;margin-top:2px;display:flex;align-items:center;gap:6px}
  .nlink{font-size:10px;font-weight:800;color:var(--lav);display:inline-flex;align-items:center;gap:3px}
  .ev.now .tm{color:var(--crit)}

  /* week strip */
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .wd{background:var(--panel-2);border-radius:12px;padding:9px 4px;text-align:center}
  .wd.today{background:linear-gradient(160deg,var(--lav-soft),color-mix(in srgb,var(--peach-soft) 70%,var(--panel)));box-shadow:0 4px 12px -6px rgba(120,90,170,.5)}
  .wd small{font-size:9px;color:var(--ink-faint);font-weight:700;display:block}
  .wd.today small{color:var(--ink)}
  .wd b{font-size:15px;font-weight:800;display:block;margin:1px 0 4px}
  .wd .cnt{display:inline-block;font-size:9px;font-weight:800;background:color-mix(in srgb,var(--sky) 26%,transparent);color:var(--sky);border-radius:999px;padding:1px 6px;min-width:16px}
  .wd .cnt.z{background:transparent;color:var(--ink-faint)}

  /* inbox */
  .inbox{display:grid;gap:10px}
  .in{display:flex;align-items:center;gap:12px;background:var(--panel-2);border-radius:14px;padding:12px 14px}
  .in .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:16px;flex:0 0 34px}
  .in .il{flex:1;min-width:0}
  .in .il b{font-size:13.5px;font-weight:700;display:block}
  .in .il small{font-size:11px;color:var(--ink-faint);font-weight:600}
  .in .num{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1}
  .in .num.z{color:var(--ink-faint)}
  .ic-mail{background:color-mix(in srgb,var(--sky) 22%,transparent)}
  .ic-msg{background:color-mix(in srgb,var(--lav) 22%,transparent)}
  .ic-exp{background:color-mix(in srgb,var(--butter) 30%,transparent)}
  .num-mail{color:var(--sky)} .num-msg{color:var(--lav)} .num-exp{color:var(--warn)}

  /* daily form (型) */
  .form2{display:grid;gap:14px}
  .fseg .fh{font-size:11px;font-weight:800;color:var(--ink-soft);margin-bottom:4px;display:flex;align-items:center;gap:6px}
  .fseg .fh .dot{width:8px;height:8px;border-radius:50%}
  .step{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:13px;font-weight:600}
  .step .ck{width:16px;height:16px;border-radius:50%;border:2px solid var(--hair);flex:0 0 16px}
  .step .tmn{font-size:11px;color:var(--ink-faint);font-weight:800;min-width:36px;font-variant-numeric:tabular-nums}
  .step.on .ck{background:var(--mint);border-color:var(--mint);position:relative}
  .step.on .ck::after{content:"✓";position:absolute;inset:0;color:#fff;font-size:9px;display:grid;place-items:center}
  .step.on .lbl{color:var(--ink-faint)}
  .step .lbl{flex:1}

  /* habits */
  .habit{display:flex;align-items:center;gap:11px;padding:9px 0;border-top:1px solid var(--hair)}
  .habit:first-of-type{border-top:0}
  .habit .he{font-size:16px;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--panel-2);flex:0 0 30px}
  .habit .hl{flex:1;min-width:0}
  .habit .hl b{font-size:13.5px;font-weight:700;display:block}
  .habit .hl small{font-size:11px;color:var(--ink-faint)}
  .streak{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:var(--mint);white-space:nowrap}
  .pips{display:flex;gap:3px}
  .pips i{width:7px;height:7px;border-radius:50%;background:var(--hair)}
  .pips i.f{background:var(--mint)}
  .htag{font-size:10px;font-weight:800;color:var(--lav);background:color-mix(in srgb,var(--lav) 16%,transparent);padding:3px 8px;border-radius:999px;white-space:nowrap}

  /* week density */
  .wd.d2 .cnt{background:color-mix(in srgb,var(--butter) 32%,transparent);color:var(--warn)}
  .wd.d3{background:color-mix(in srgb,var(--crit) 12%,transparent)}
  .wd.d3 .cnt{background:color-mix(in srgb,var(--crit) 22%,transparent);color:var(--crit)}
  .legend{display:flex;gap:12px;margin-top:10px;font-size:10px;color:var(--ink-faint);font-weight:700;flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend i{width:9px;height:9px;border-radius:3px}
  .valueline{margin:10px 0 0;font-size:11.5px;color:var(--ink-faint);line-height:1.65}

  .dock{display:flex;justify-content:space-around;padding:10px 8px 4px;margin-top:4px}
  .dock button{appearance:none;border:0;background:transparent;cursor:pointer;font-family:inherit;
    display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-faint);font-size:9px;font-weight:700;padding:4px}
  .dock button .ic{width:24px;height:24px;border-radius:9px;display:grid;place-items:center;font-size:14px}
  .dock button[aria-current="true"]{color:var(--lav)}
  .dock button[aria-current="true"] .ic{background:color-mix(in srgb,var(--lav) 20%,transparent)}
  .dock button:focus-visible{outline:2px solid var(--lav);outline-offset:2px;border-radius:10px}

  .note{max-width:840px;font-size:12.5px;color:var(--ink-faint);text-align:center;line-height:1.7}
  .note b{color:var(--ink-soft)}

  @media (max-width:520px){
    .device{--w:100%;max-width:392px} .device.open{--w:100%} .brand .sub{display:none}
  }
  @media (prefers-reduced-motion: reduce){ .device{transition:none} }

  /* ===== 実機モード：枠を外して画面いっぱい。実際の折り曲げに自動追従 ===== */
  body.real{padding:0;gap:0;background:var(--ground);min-height:100svh}
  body.real .topbar{width:100%;max-width:none;padding:10px 16px;position:sticky;top:0;z-index:20;
    background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--hair)}
  body.real .brand .sub{display:none}
  body.real .seg{display:none}          /* 実機では手動トグル不要（本体の開閉に追従） */
  body.real .note{display:none}
  body.real .stage{perspective:none;flex:1}
  body.real .device,body.real .device.open{width:100%;max-width:none;flex:1 1 auto;padding:0;
    border-radius:0;background:transparent;box-shadow:none;transition:none}
  body.real .device::before{display:none}
  body.real .screen{border-radius:0;min-height:calc(100svh - 52px)}
  body.real .statusbar{display:none}    /* 実機のステータスバーがあるので不要 */
  /* 内側画面を開いた（＝ヒンジをまたぐ2セグメント）ときは自動で2ペイン */
  @media (horizontal-viewport-segments: 2){
    body.real .device .grid{grid-template-columns:1fr 1fr;gap:16px}
    body.real .device .screen::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:26px;
      transform:translateX(-50%);background:linear-gradient(90deg,transparent,var(--crease) 42%,var(--crease) 58%,transparent);pointer-events:none;z-index:5}
  }
</style>

<div class="topbar">
  <div class="brand"><span class="mark">Y-tion</span><span class="sub">Personal Cockpit</span></div>
  <div class="controls">
    <div class="seg" role="group" aria-label="デバイスの状態">
      <button id="btn-fold" aria-pressed="true">折 Cover</button>
      <button id="btn-open" aria-pressed="false">開 Unfold</button>
    </div>
    <button class="ghost" id="btn-theme" title="テーマ切替">◐ Theme</button>
  </div>
</div>

<div class="stage">
  <div class="device" id="device">
    <div class="screen">
      <div class="statusbar">
        <span class="tabnum">9:41</span>
        <span style="font-weight:800;color:var(--ink)">（曜）m/d</span>
        <span class="dots" aria-hidden="true"><span></span><span></span><span></span><i></i></span>
      </div>
      <div class="canvas">
        <div class="grid" id="grid"></div>
        <nav class="dock" aria-label="メインナビ">
          <button aria-current="true"><span class="ic">🏠</span>ホーム</button>
          <button><span class="ic">💼</span>Work</button>
          <button><span class="ic">🏡</span>Private</button>
          <button><span class="ic">📅</span>予定</button>
          <button><span class="ic">📥</span>受信</button>
        </nav>
      </div>
    </div>
  </div>
</div>

<p class="note">
  <b>使い方</b> — 上の <b>「折 / 開」</b> で Galaxy Z Fold8 の開閉を切り替えると、
  <b>今日のフォーカス → 2ペインの司令室</b> にリフローします。カードは
  <b>Gmailトリアージ・Messengerチェック・MF経費・MTG議事録TODO・当日MTG</b> など、あなたが Claude に設定済みの流れに対応。データは現在モックです。
</p>

<script>
(function(){
  "use strict";
  var device=document.getElementById('device'), grid=document.getElementById('grid');
  var bF=document.getElementById('btn-fold'), bO=document.getElementById('btn-open');
  function setState(open){
    device.classList.toggle('open',open);
    bO.setAttribute('aria-pressed',open?'true':'false');
    bF.setAttribute('aria-pressed',open?'false':'true');
    render(open);
  }
  bF.addEventListener('click',function(){setState(false);});
  bO.addEventListener('click',function(){setState(true);});
  var root=document.documentElement;
  document.getElementById('btn-theme').addEventListener('click',function(){
    var cur=root.getAttribute('data-theme');
    var dark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
    var isDark=cur?cur==='dark':dark;
    root.setAttribute('data-theme',isDark?'light':'dark');
  });

  // ---------- mock data (grounded in the user's configured skills) ----------
  var focus=[
    {t:'添田さんのパートナー面接を調整する', src:'Work',  cls:'w', c:'var(--sky)', meta:'今週・X定例'},
    {t:'MTGのフォローTODO', src:'MTG', cls:'m', c:'var(--lav)', meta:'議事録由来'},
    {t:'私用の最優先タスク', src:'Private', cls:'p', c:'var(--peach)', meta:'今日'}
  ];
  // __SYNC__ Work: NotionのMTG議事録アクションアイテム（未完了）で置換（プレースホルダ）
  var work=[
    {r:'A', t:'業務タスク サンプル1', due:'—', badge:'MTG'},
    {r:'B', t:'業務タスク サンプル2', due:'—', badge:'MTG'}
  ];
  // __SYNC__ Private: Notion「パーソナルタスク」DBの未完了で置換（プレースホルダ）
  var priv=[
    {r:'A', t:'私用タスク サンプル1', due:'—'},
    {r:'B', t:'私用タスク サンプル2', due:'—'}
  ];
  // __SYNC__ MTG: Googleカレンダーの当日イベント（会議）で置換（プレースホルダ）。無い日は []
  var mtg=[
    {tm:'10:00', n:'会議サンプル1', m:'参加n名'},
    {tm:'14:00', n:'会議サンプル2', m:'オンライン'}
  ];   // 土曜は予定なし
  // __SYNC__ Week: Googleカレンダーの当週各日の会議件数で置換（プレースホルダ）。today に当日
  var week=[
    {d:'月',n:1,c:0},{d:'火',n:2,c:0},{d:'水',n:3,c:0},{d:'木',n:4,c:0,today:true},
    {d:'金',n:5,c:0},{d:'土',n:6,c:0},{d:'日',n:7,c:0}
  ];
  // __SYNC__ Inbox: mail=Gmail未読(要対応相当)件数で置換。msg/exp は朝の巡回スキル更新(未接続なら n:null)
  var inbox=[
    {k:'mail', ic:'✉️', l:'メール 要対応', s:'Gmail 未読（要対応）', n:0, live:true},
    {k:'msg',  ic:'💬', l:'Messenger 未返信', s:'朝の巡回で更新', n:null},
    {k:'exp',  ic:'🧾', l:'経費 要確認', s:'MF・朝の巡回で更新', n:null}
  ];
  // ---- from 実践ノート（取扱説明書） ----
  var katanaAM=[
    {tm:'', lbl:'朝の支度', on:true},
    {tm:'', lbl:'朝ごはん', on:true},
    {tm:'', lbl:'仕事を始める', on:false}
  ];
  var katanaPM=[
    {tm:'19:30', lbl:'夕食おわり', on:false},
    {tm:'20:30', lbl:'休憩・かたづけ', on:false},
    {tm:'21:00', lbl:'リラックス', on:false},
    {tm:'21:30', lbl:'就寝', on:false}
  ];
  var habits=[
    {e:'🥊', n:'運動（有酸素）', s:'週2回', done:1, of:2, streak:7},
    {e:'💪', n:'運動（筋トレ）', s:'週1回', done:1, of:1, streak:12},
    {e:'🗓️', n:'週次プランニング', s:'毎週 金曜', tag:'次は金'},
    {e:'🌙', n:'就寝前リマインダー', s:'夜のリマインダー', tag:'ON'}
  ];

  function heroCard(){
    var totalMtg=mtg.length, totalTodo=inbox.reduce(function(a,i){return a+(i.n||0);},0);
    return '<div class="card hero">'+
      '<div class="hi">'+(function(){var h=new Date().getHours();return (h<5?'こんばんは':h<11?'おはようございます':h<18?'こんにちは':'こんばんは')+'、由貴さん 🌿';})()+'</div>'+
      '<div class="big">今日は 深呼吸して 1つずつ。</div>'+
      '<div class="sums">'+
        '<span class="sumpill"><span class="d" style="background:var(--sky)"></span>MTG <b class="tabnum">'+totalMtg+'</b>件</span>'+
        '<span class="sumpill"><span class="d" style="background:var(--peach)"></span>フォーカス <b class="tabnum">3</b>件</span>'+
        '<span class="sumpill"><span class="d" style="background:var(--butter)"></span>要対応 <b class="tabnum">'+totalTodo+'</b></span>'+
      '</div>'+
      '<div class="valueline">できることを、ひとつずつ 🌿</div></div>';
  }
  function focusCard(){
    var rows=focus.map(function(f){
      return '<div class="frow"><span class="tagd" style="background:'+f.c+'"></span>'+
        '<span class="ft">'+f.t+'</span>'+
        '<span class="src src-'+f.cls+'">'+f.src+'</span>'+
        '<span class="fmeta">'+f.meta+'</span></div>';
    }).join('');
    return '<div class="card"><h3><span class="tick" style="background:color-mix(in srgb,var(--lav) 22%,transparent)">⭐</span>今日のフォーカス</h3>'+
      '<div class="focus">'+rows+'</div></div>';
  }
  function tasksCard(title,icon,tint,arr,limit){
    var list=arr.slice(0,limit||arr.length).map(function(t){
      return '<div class="task"><span class="rank rk-'+t.r+'">'+t.r+'</span>'+
        '<span class="tt">'+t.t+'</span>'+
        (t.badge?'<span class="badge">'+t.badge+'</span>':'')+
        '<span class="due'+(t.soon?' soon':'')+'">'+t.due+'</span>'+
        '<span class="box"></span></div>';
    }).join('');
    return '<div class="card"><h3><span class="tick" style="background:'+tint+'">'+icon+'</span>'+title+'</h3>'+list+'</div>';
  }
  function mtgCard(){
    var rows = mtg.length ? mtg.map(function(e){
      return '<div class="ev'+(e.now?' now':'')+'"><span class="tm tabnum">'+e.tm+'</span>'+
        '<div class="bd"><div class="en">'+e.n+'</div>'+
        '<div class="em"><span>'+e.m+'</span></div></div></div>';
    }).join('')
    : '<div style="padding:14px 6px;text-align:center;color:var(--ink-faint);font-size:13px;font-weight:600">今日の予定はありません 🌿<br><span style="font-size:11px">ゆっくり過ごしましょう</span></div>';
    return '<div class="card"><h3><span class="tick" style="background:color-mix(in srgb,var(--sky) 22%,transparent)">📅</span>今日のMTG'+calTag+'</h3>'+
      '<div class="tl">'+rows+'</div></div>';
  }
  function weekCard(){
    function dens(c){ return c>=5?3:(c>=3?2:1); }
    var cols=week.map(function(w){
      var d=dens(w.c);
      var label = w.off ? '休' : (w.c?w.c:'–');
      return '<div class="wd'+(w.today?' today':'')+' d'+d+'"><small>'+w.d+'</small><b class="tabnum">'+w.n+'</b>'+
        '<span class="cnt'+(w.c?'':' z')+'">'+label+'</span></div>';
    }).join('');
    return '<div class="card"><h3><span class="tick" style="background:color-mix(in srgb,var(--mint) 22%,transparent)">🗓️</span>今週のスケジュール<span style="margin-left:auto;font-weight:700;color:var(--warn);text-transform:none;letter-spacing:0">水曜がパツパツ</span></h3>'+
      '<div class="week">'+cols+'</div>'+
      '<div class="legend">'+
        '<span><i style="background:var(--panel-2)"></i>ゆとり</span>'+
        '<span><i style="background:color-mix(in srgb,var(--butter) 42%,transparent)"></i>ちょうど</span>'+
        '<span><i style="background:color-mix(in srgb,var(--crit) 32%,transparent)"></i>パツパツ</span>'+
      '</div></div>';
  }
  function katanaCard(){
    function seg(title,color,arr){
      var steps=arr.map(function(s){
        return '<div class="step'+(s.on?' on':'')+'"><span class="ck"></span>'+
          '<span class="tmn">'+(s.tm||'')+'</span>'+
          '<span class="lbl">'+s.lbl+'</span></div>';
      }).join('');
      return '<div class="fseg"><div class="fh"><span class="dot" style="background:'+color+'"></span>'+title+'</div>'+steps+'</div>';
    }
    return '<div class="card"><h3><span class="tick" style="background:color-mix(in srgb,var(--peach) 24%,transparent)">🌿</span>今日の型</h3>'+
      '<div class="form2">'+ seg('朝のルーティン','var(--butter)',katanaAM)+ seg('夜のルーティン','var(--lav)',katanaPM) +'</div></div>';
  }
  function habitCard(){
    var rows=habits.map(function(h){
      var right;
      if(h.of){
        var pips='';for(var i=0;i<h.of;i++){pips+='<i class="'+(i<h.done?'f':'')+'"></i>';}
        right='<span class="streak"><span class="pips">'+pips+'</span>🔥'+h.streak+'週</span>';
      } else { right='<span class="htag">'+h.tag+'</span>'; }
      return '<div class="habit"><span class="he">'+h.e+'</span>'+
        '<span class="hl"><b>'+h.n+'</b><small>'+h.s+'</small></span>'+right+'</div>';
    }).join('');
    return '<div class="card"><h3><span class="tick" style="background:color-mix(in srgb,var(--mint) 22%,transparent)">🔥</span>稼働中の習慣</h3>'+rows+
      '<p class="valueline">つづけられた日は、それだけで花丸。</p></div>';
  }
  function inboxCard(){
    var rows=inbox.map(function(i){
      var val = (i.n==null) ? '–' : i.n;
      return '<div class="in"><span class="ic ic-'+i.k+'">'+i.ic+'</span>'+
        '<span class="il"><b>'+i.l+(i.live?' <span style="font-size:9px;font-weight:800;color:var(--sky);vertical-align:middle">●LIVE</span>':'')+'</b><small>'+i.s+'</small></span>'+
        '<span class="num'+((i.n!=null)?' num-'+i.k:' z')+' tabnum">'+val+'</span></div>';
    }).join('');
    return '<div class="card"><h3><span class="tick" style="background:color-mix(in srgb,var(--butter) 28%,transparent)">📥</span>要対応インボックス</h3>'+
      '<div class="inbox">'+rows+'</div></div>';
  }

  var sky='color-mix(in srgb,var(--sky) 22%,transparent)';
  var peach='color-mix(in srgb,var(--peach) 24%,transparent)';
  var syncTag='<span style="margin-left:auto;font-weight:800;color:var(--lav);text-transform:none;letter-spacing:0;font-size:10px;background:color-mix(in srgb,var(--lav) 16%,transparent);padding:2px 9px;border-radius:999px">🔗 Notion同期</span>';
  var SYNC_DATE='m/d';   // 最終同期日（スナップショット）
  var calTag='<span style="margin-left:auto;font-weight:800;color:var(--sky);text-transform:none;letter-spacing:0;font-size:10px;background:color-mix(in srgb,var(--sky) 18%,transparent);padding:2px 9px;border-radius:999px">📅 同期 '+SYNC_DATE+'</span>';

  function render(open){
    if(open){
      grid.innerHTML=
        '<div class="col">'+ heroCard()+ focusCard()+ katanaCard()+ tasksCard('タスク Work'+syncTag,'💼',sky,work)+ tasksCard('タスク Private'+syncTag,'🏡',peach,priv) +'</div>'+
        '<div class="col">'+ mtgCard()+ weekCard()+ habitCard()+ inboxCard() +'</div>';
    } else {
      grid.innerHTML=
        '<div class="col">'+ heroCard()+ focusCard()+ katanaCard()+ tasksCard('タスク Private'+syncTag,'🏡',peach,priv,3)+ habitCard()+ mtgCard()+ inboxCard() +'</div>';
    }
  }
  render(false);

  // ===== 実機モード：実際のデバイスの折り曲げに自動追従 =====
  var mqFold=null;
  try{ mqFold=window.matchMedia('(horizontal-viewport-segments: 2)'); }catch(e){}
  function isRealDevice(){ return window.matchMedia('(pointer: coarse)').matches; }
  function detectUnfolded(){
    if(mqFold && mqFold.matches) return true;                                  // ヒンジをまたぐ＝開いた
    if(navigator.devicePosture && navigator.devicePosture.type==='continuous') return true;
    return window.innerWidth >= 600;                                            // フォールバック（内側画面は広い）
  }
  function syncToDevice(){
    if(!isRealDevice()){ document.body.classList.remove('real'); return; }      // PCは手動シミュレーターのまま
    document.body.classList.add('real');
    setState(detectUnfolded());
  }
  window.addEventListener('resize', syncToDevice);
  if(mqFold && mqFold.addEventListener) mqFold.addEventListener('change', syncToDevice);
  if(navigator.devicePosture && navigator.devicePosture.addEventListener) navigator.devicePosture.addEventListener('change', syncToDevice);
  syncToDevice();
})();
</script>

</body>
</html>
